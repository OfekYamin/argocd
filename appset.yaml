apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: example-applicationset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: dev
            team: team-a
          - cluster: qa
            team: team-a
  template:
    metadata:
      name: '{{team}}-{{cluster}}'
    spec:
      project: default
      source:
        repoURL: 
        targetRevision: appset
        path: '{{team}}/k8s-{{cluster}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{team}}-{{cluster}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
            syncOptions:
      -     CreateNamespace=true