apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd 
spec:
  project: my-project
  source:
    chart: jenkins
    repoURL: https://jenkins.io 
    targetRevision: 5.7.x              
    helm:
      valueFiles:
        - values.yaml                  
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins                 
  syncPolicy:
    automated:                         
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true      
